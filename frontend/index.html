<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebPython</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e9eef8;font-family:system-ui,sans-serif}header{height:56px;padding:0 16px;border-bottom:1px solid #26304a;display:flex;align-items:center;justify-content:space-between}.status{font-size:13px;color:#9fb0ce}main{height:calc(100vh - 56px);display:grid;grid-template-columns:220px 1fr}aside{border-right:1px solid #26304a;padding:14px}.file{padding:9px;background:#151c31;border-radius:7px}.workspace{min-width:0;display:flex;flex-direction:column}.toolbar{padding:9px;border-bottom:1px solid #26304a;display:flex;gap:8px}button{background:#172039;color:#fff;border:1px solid #3b496a;border-radius:7px;padding:8px 13px;font-weight:700;cursor:pointer}button:hover{background:#243252}textarea{flex:1;min-height:250px;resize:none;border:0;outline:0;padding:16px;background:#0f1527;color:#eef2fa;font:14px/1.55 ui-monospace,monospace}.output{height:260px;border-top:1px solid #26304a;padding:12px;overflow:auto;background:#080c17}pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace}.good{color:#7fe2a4}.bad{color:#ff9292}@media(max-width:700px){main{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<header><strong>WebPython</strong><span id="status" class="status">Loading Python runtime...</span></header>
<main><aside><div class="file">📄 main.py</div><p>Project: default</p><small>Python runs in your browser.</small></aside><div class="workspace"><div class="toolbar"><button onclick="build()">BUILD</button><button onclick="run()">RUN</button><button onclick="execute()">EXECUTE</button></div><textarea id="code" spellcheck="false">print("Hello from WebPython")

import math
print(math.sqrt(144))

for i in range(3):
    print("Python", i + 1)
</textarea><div class="output"><strong>Output</strong><div id="out"><pre>Loading Python...</pre></div></div></div></main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js"></script>
<script>
let pyodide=null, ready=false;
const code=()=>document.getElementById("code").value;
const out=document.getElementById("out");
const status=document.getElementById("status");
const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
function show(text,good=true){out.innerHTML=`<pre class="${good?"good":"bad"}">${esc(text)}</pre>`}
async function init(){try{pyodide=await loadPyodide();ready=true;status.textContent=`${pyodide.runPython("import platform,sys; platform.python_implementation() + ' ' + platform.python_version()")} • READY`;show("Ready. Write Python and press EXECUTE.")}catch(e){status.textContent="Python runtime failed";show(e,true)}}
function build(){if(!ready)return show("Python runtime is still loading.",false);try{pyodide.runPython(code());show("BUILD PASS\nSyntax and execution preparation succeeded.")}catch(e){show(String(e),false)}}
function run(){execute()}
async function execute(){if(!ready)return show("Python runtime is still loading.",false);const source=code();try{const wrapped=`import io, contextlib\n_buf=io.StringIO()\nwith contextlib.redirect_stdout(_buf), contextlib.redirect_stderr(_buf):\n    exec(${JSON.stringify(source)}, {})\n_buf.getvalue()`;const result=pyodide.runPython(wrapped);show(result || "(no output)\n\nExit code: 0")}catch(e){show(String(e),false)}}
init();
</script>
</body>
</html>
